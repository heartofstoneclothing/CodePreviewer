<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Preview</title>
  <script>
    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name) || '';
    }

    const html = decodeURIComponent(getParam('html'));
    const cssFile = getParam('css');
    const jsFile = getParam('js');
    const cssCode = decodeURIComponent(getParam('cssCode') || '');
    const jsCode = decodeURIComponent(getParam('jsCode') || '');

    const iframe = document.createElement('iframe');
    iframe.style.width = '100%';
    iframe.style.height = '90vh';
    document.body.appendChild(iframe);

    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(`
      <html>
        <head>
          ${cssFile ? `<link rel="stylesheet" href="css/${cssFile}">` : ''}
          <style>${cssCode}</style>
        </head>
        <body>
          ${html}
          <script src="js/logger.js"><\/script>
          ${jsFile ? `<script src="js/${jsFile}"><\/script>` : ''}
          <script>${jsCode}<\/script>
        </body>
      </html>
    `);
    doc.close();
  </script>
</head>
<body>
</body>
</html>
